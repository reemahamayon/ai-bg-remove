<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BgSnip</title>
  <link rel="stylesheet" href="../cssFile/globalStyles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="../index.html">✂️ BgSnip</a>
    <button class="menu-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><button onclick="window.location.href='signup.html'">Sign Up</button></li>
      <li><button id="theme-toggle" class="border-button">🌙</button></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <section class="page login-page">
    <div class="section-header">
      <span class="section-tag">Welcome Back</span>
      <h2>Login to BgSnip</h2>
      <p>Continue removing backgrounds with AI.</p>
    </div>

    <div class="form-container">
      <div id="login-alert"></div>

      <form id="login-form">
        <div>
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>

        <div>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Your password" required />
        </div>

        <div class="forgot-password-row">
          <button type="button" class="link-button">Forgot password?</button>
        </div>

        <div>
          <button type="submit" class="lg-button full-width">
            Login
          </button>
        </div>

        <div class="signup-text">
          <p>Don't have an account? <a href="signup.html">Sign up free</a></p>
        </div>

      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-container">
      <div>
        <h1>✂️ BgSnip</h1>
        <p>AI-powered background removal.</p>
      </div>
      <div>
        <h2>Links</h2>
        <a href="../index.html">Home</a>
        <a href="signup.html">Signup</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <p>© 2025 BgSnip. All rights reserved.</p>
  </footer>

  <script src="../jsFile/jsFunctions.js"></script>
</body>
</html>
